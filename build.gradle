plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id
base { archivesName = 'WorldPlayers' }

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

sourceSets.main.resources { srcDir('src/generated/resources') }

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
    data {
        arguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Jade：可选软依赖，只在编译期用；运行时没装 Jade 就不会加载这些类。
    compileOnly files('libs/jade-15.10.6-api.jar')

    // 3D Skin Layers：可选软依赖，只在编译期用；运行时通过反射探测，没装就不加载兼容类。
    compileOnly files('libs/skinlayers3d-1.11.4-api.jar')

    // Chat Heads：可选软依赖，只在编译期用；运行时先查 ModList 再加载联动类。
    compileOnly files('libs/chat_heads-api.jar')
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
